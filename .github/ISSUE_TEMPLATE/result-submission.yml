name: Submit benchmark results
description: Send native Harbor job files for publication on ScopeBench.
title: "Result: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Run Harbor locally and send the complete native job ZIP.
        We extract the harness, recorded version, models, and configuration from those files.
        See https://scopebench.maxh.io/submit. Harbor Hub is not required.
        Attach the ZIP here or provide a download link maintainers can access.
  - type: textarea
    id: evidence
    attributes:
      label: Complete Harbor job files
      description: Attach a ZIP or link the complete saved job folder(s), including all attempts, configurations, trajectories, verifier outputs, and judge logs. Do not re-enter the model, harness version, or configuration.
    validations:
      required: true
  - type: textarea
    id: attribution
    attributes:
      label: Attribution and additional context (optional)
      description: Your name or organization, a harness repository URL, or context not already recorded in the run. Otherwise we attribute the submission to your GitHub handle.
  - type: checkboxes
    id: public
    attributes:
      label: Publication
      options:
        - label: I authorize public publication of these run files and have removed credentials.
          required: true
